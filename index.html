 if(!Number.isInteger(n)||n<0||n>2999)throw Error('Outside the course number range');

 const r=n%(n<1000?100:1000);if(!r)return base;
 if(r<10)return base+' '+JOIN_ONES[g][r];
 if(r<20){let t=numberWords(r,g);return base+' '+(t.startsWith('שְׁ')?'וּ':t.startsWith('עֲ')?'וַ':'וְ')+t;}
 if(r%10===0 && r<100){let t=numberWords(r,g);return base+' '+(t.startsWith('שְׁ')?'וּ':'וְ')+t;}
 if(r===100)return base+' וּמֵאָה';

 return base+' '+numberWords(r,g);

let infoKind='help',infoConfirm=false;
function openInfo(kind){infoKind=kind;infoConfirm=false;renderInfo();$('#info').showModal();$('#info').scrollTop=0;}
function renderInfo(){
 const l=state.uiLang,t=INFO[l],body=$('#info-body');$('#info-langs').hidden=false;
 $('#info-heading').textContent=t[infoKind];$('#info-heading').dir=l==='he'?'rtl':'ltr';$('#info-heading').lang=l==='pt'?'pt-BR':l;
 body.dir=l==='he'?'rtl':'ltr';body.lang=l==='pt'?'pt-BR':l;body.classList.toggle('foreign',l!=='he');
 $$('[data-info-lang]').forEach(b=>{b.classList.toggle('active',b.dataset.infoLang===l);b.setAttribute('aria-pressed',String(b.dataset.infoLang===l));});
 $('#info-close').setAttribute('aria-label',l==='he'?'סְגִירָה':l==='en'?'Close':'Fechar');
 if(infoKind==='help')body.innerHTML=`<ol class="help-list">${t.helpItems.map(x=>`<li>${bidi(x)}</li>`).join('')}</ol>`;
 else if(infoKind==='plan')body.innerHTML=`<p class="info-lead">${esc(t.planIntro)}</p><table class="plan-table"><thead><tr><th>${t.part}</th><th>${t.minutes}</th><th>${t.cards}</th></tr></thead><tbody>${LESSON_PHASES.map((p,i)=>`<tr><td>${t.phases[i]}</td><td><bdi dir="ltr">${p[1]}</bdi></td><td>${p[2].length||t.asNeeded}</td></tr>`).join('')}</tbody></table><p>${t.planEnd}</p><p>${t.free}</p>`;
 else if(infoConfirm)body.innerHTML=`<p>${t.confirm}</p><div class="action-row"><button id="confirm-reset" class="danger">${ico('trash')}${t.erase}</button><button id="cancel-reset">${t.cancel}</button></div>`;
 else body.innerHTML=`<div class="restart-options"><button id="repeat-lesson">${ico('replay')}<span><strong>${t.same}</strong><small>${t.sameNote}</small></span></button><button id="fresh-lesson">${ico('shuffle')}<span><strong>${t.fresh}</strong><small>${t.freshNote}</small></span></button></div><p class="small">${t.retained}</p><hr><button id="ask-reset" class="danger-outline">${ico('trash')}${t.reset}</button><p class="small">${t.resetNote}</p>`;
 $('#repeat-lesson')?.addEventListener('click',()=>{startLesson(false);$('#info').close();});
 $('#fresh-lesson')?.addEventListener('click',()=>{startLesson(true);$('#info').close();});
 $('#ask-reset')?.addEventListener('click',()=>{infoConfirm=true;renderInfo();});
 $('#cancel-reset')?.addEventListener('click',()=>{infoConfirm=false;renderInfo();});
 $('#confirm-reset')?.addEventListener('click',()=>{state.grades={};state.drafts={};state.positions={};state.reviewIds=[];state.reviewScores={};state.reviewDrafts={};state.reviewIndex=0;startLesson(true);$('#info').close();});
}
$$('[data-info-lang]').forEach(b=>b.onclick=()=>{const y=$('#info').scrollTop;state.uiLang=b.dataset.infoLang;save();renderInfo();$('#info').scrollTop=y;});
$('#plan').onclick=()=>openInfo('plan');$('#instructions').onclick=()=>openInfo('help');$('#new').onclick=()=>openInfo('restart');
$$('[data-icon]').forEach(el=>el.innerHTML=ico(el.dataset.icon));

render();save();
window.trainingApp={verbs:VERBS,cards:CARDS,get lesson(){return state.lessonIds;},numberWords,counted,normalize,getState:()=>state,setMode,openRef,makeLesson,startLesson};

</script></body></html>
